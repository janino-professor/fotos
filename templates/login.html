<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mural da Família</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <i class="fa-solid fa-lock logo-icon"></i>
                <h1>Acesso Restrito</h1>
                <p>Identifique-se para acessar o Mural da Família</p>
            </div>

            {% if erro %}
                <div class="status-msg status-error" style="margin-bottom: 15px;">
                    {{ erro }}
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="folder-input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Nome de usuário" required>
                </div>

                <div class="folder-input-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" name="password" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
            </form>
        </div>
    </div>

</body>
</html>
